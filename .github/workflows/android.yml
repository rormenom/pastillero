name: Construir APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --no-audit --no-fund
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Instalar dependencias y compilar la web
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Crear proyecto Android
        run: |
          [ -d android ] || npx cap add android
          npx @capacitor/assets generate --android
          mkdir -p android/app/src/main/res/drawable
          cp android-res/drawable/*.xml android/app/src/main/res/drawable/
          npx cap sync android

      - name: Firmar (opcional) y compilar
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/release.jks
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=$PWD/app/release.jks \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASS" \
              -Pandroid.injected.signing.key.alias=pastillero \
              -Pandroid.injected.signing.key.password="$KEYSTORE_PASS"
            cp app/build/outputs/apk/release/app-release.apk ../Pastillero.apk
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../Pastillero.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Pastillero-apk
          path: Pastillero.apk
